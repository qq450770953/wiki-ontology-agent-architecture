  <text x="415" y="496" font-size="11" fill="#7A5AF8" text-anchor="middle" dominant-baseline="central">按 Ontology 物化 → 写入 Context 状态</text>
</g>
<line x1="415" y1="508" x2="415" y2="516" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

