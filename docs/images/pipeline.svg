  <text x="415" y="330" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">Ontology 实体消歧</text>
  <text x="415" y="346" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">实体ID · 指标口径 · 期间版本</text>
</g>
<line x1="415" y1="358" x2="415" y2="366" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="245" y="366" width="340" height="42" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="415" y="380" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">工具映射 + SQL 模板</text>
