  <rect x="245" y="464" width="340" height="42" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="415" y="478" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">LLM 汇总解释</text>
