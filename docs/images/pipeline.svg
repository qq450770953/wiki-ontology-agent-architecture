<svg viewBox="0 0 680 750" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>完整链路：命中直接调用已固化 Workflow / 未命中先执行五步、确认后构图固化</title>
<desc>用户提问先查 Wiki 层固化流程注册表；命中则左侧直接调用已固化的 LangGraph Workflow，未命中则右侧直接执行五步自主管线（映射、消歧、工具绑定、执行、汇总），正向反馈确认无误后按执行轨迹做 LangGraph 动态构图生成 Workflow 定义，经人工审批后更新 Wiki 连接，形成闭环</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="60" y="40" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">完整链路：命中直接调用已固化 Workflow / 未命中先执行五步 → 确认后构图固化 → 更新 Wiki 连接</text>

