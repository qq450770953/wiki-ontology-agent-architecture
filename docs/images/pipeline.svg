  <text x="415" y="580" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">正向反馈确认</text>
  <text x="415" y="596" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">采纳 · 核对 · 评测通过</text>
