  <text x="415" y="530" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">LLM 汇总解释</text>
  <text x="415" y="546" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">读取组装后的 ContextPack · 计算 · 归因</text>
</g>
<line x1="415" y1="558" x2="415" y2="566" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

