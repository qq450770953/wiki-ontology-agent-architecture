  <text x="415" y="394" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">MCP / CLI · 拼各系统 SQL</text>
</g>
<line x1="415" y1="406" x2="415" y2="414" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="245" y="414" width="340" height="42" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="415" y="428" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">各系统执行 SQL</text>
  <text x="415" y="444" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">数据库 / 数仓 / CRM</text>
</g>
<line x1="415" y1="456" x2="415" y2="464" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

