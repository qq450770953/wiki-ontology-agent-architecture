  <text x="340" y="206" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">命中固化流程？</text>
</g>

<text x="152" y="198" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">命中</text>
<text x="485" y="198" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">未命中</text>

