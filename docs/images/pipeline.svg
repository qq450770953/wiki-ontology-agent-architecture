</g>
<line x1="415" y1="506" x2="415" y2="526" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="230" y="526" width="370" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="415" y="542" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">正向反馈确认</text>
  <text x="415" y="558" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">采纳 · 核对 · 评测通过</text>
</g>
<line x1="415" y1="570" x2="415" y2="588" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="230" y="588" width="370" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="415" y="604" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">总结固化进 Wiki</text>
  <text x="415" y="620" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">别名 · 模板 · 口径写回 · 标记版本</text>
</g>

<path d="M 600 610 L 628 610 L 628 148 L 480 148" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="554" y="140" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">知识复利：固化后下次入口直接命中</text>
</svg>
