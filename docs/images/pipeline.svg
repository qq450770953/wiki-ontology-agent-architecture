<!-- 知识闭环（绿色）：过审后更新 Wiki 连接，下次命中直接调用 -->
<path d="M 600 742 L 632 742 L 632 148 L 480 148" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="560" y="140" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">过审后更新 Wiki 连接，下次命中直接调用（知识闭环）</text>

<!-- 认知闭环（紫色）：确认后状态/结论回流更新 Context -->
<path d="M 585 587 L 612 587 L 612 487 L 592 487" fill="none" stroke="#7A5AF8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="616" y="532" font-size="10" fill="#7A5AF8" dominant-baseline="central">状态</text>
<text x="616" y="546" font-size="10" fill="#7A5AF8" dominant-baseline="central">回流</text>
</svg>
