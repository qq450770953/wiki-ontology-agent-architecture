<svg viewBox="0 0 680 654" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>完整链路：未命中分支展开为自主执行管线</title>
<desc>用户提问先查 Wiki 层已固化流程；命中则左侧复用，未命中则右侧展开为关键词映射、Ontology 消歧、工具映射、SQL 执行、汇总解释五步管线，再经正向反馈确认后总结固化进 Wiki，形成闭环</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text x="60" y="40" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">完整链路：命中走规则 / 未命中走自主执行管线并反馈固化</text>

<g>
  <rect x="200" y="66" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="88" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">用户自然语言提问</text>
</g>
<line x1="340" y1="110" x2="340" y2="124" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="200" y="124" width="280" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="340" y="142" font-size="14" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">Wiki 层查询（入口过滤）</text>
  <text x="340" y="160" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">映射表 · 模板库 · 固化流程</text>
</g>
<line x1="340" y1="172" x2="340" y2="186" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="200" y="186" width="280" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="340" y="206" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">命中固化流程？</text>
</g>

<text x="152" y="198" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">命中</text>
<text x="485" y="198" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">未命中</text>

<path d="M 200 206 L 105 206 L 105 244" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 480 206 L 415 206 L 415 244" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="40" y="244" width="130" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="105" y="264" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">复用固化流程</text>
</g>
<line x1="105" y1="284" x2="105" y2="296" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<g>
  <rect x="40" y="296" width="130" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="105" y="312" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">输出结果</text>
  <text x="105" y="328" font-size="11" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">0 token · 秒级</text>
</g>

<g>
  <rect x="230" y="244" width="370" height="262" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="240" y="258" font-size="11" font-weight="500" fill="#5F5E5A" dominant-baseline="central">未命中：自主执行管线</text>
</g>

