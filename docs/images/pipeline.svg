<path d="M 480 206 L 415 206 L 415 266" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="40" y="244" width="130" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
