  <text x="415" y="280" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">关键词映射表</text>
  <text x="415" y="296" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">华东→SalesRegion · 毛利→指标类型</text>
