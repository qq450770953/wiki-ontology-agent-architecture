<svg viewBox="0 0 680 650" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>八层架构总览 v1.5</title>
<desc>入口路由层、知识层（LLM Wiki）、语义层（Ontology）、上下文层（Context，含 ContextPack 组装）、执行层、Workflow 编排层（LangGraph）、接入层与治理层（含分级授权、四层评估、运行监控）的分层架构</desc>

<text x="40" y="46" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">八层架构总览</text>
<text x="640" y="46" font-size="12" font-weight="500" fill="#888780" text-anchor="end" dominant-baseline="central">v1.5</text>

<g>
  <rect x="40" y="70" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="60" y="90" font-size="13" font-weight="500" fill="#444441" dominant-baseline="central">入口路由层</text>
  <text x="60" y="110" font-size="12" fill="#5F5E5A" dominant-baseline="central">Wiki 查询（索引匹配）→ 命中判定 → 双路径分发</text>
</g>

<g>
  <rect x="40" y="138" width="600" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="60" y="158" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">知识层（LLM Wiki）</text>
  <text x="60" y="178" font-size="12" fill="#0F6E56" dominant-baseline="central">Raw Sources · Wiki（实体/模板/映射/固化流程注册表） · Schema（治理规范）</text>
</g>

<g>
  <rect x="40" y="206" width="600" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="60" y="226" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">语义层（Ontology）</text>
  <text x="60" y="246" font-size="12" fill="#0F6E56" dominant-baseline="central">实体/别名/关系/口径版本 · 图检索（多跳）· 记忆类型分类（policy 引用 / authz 限 scope）</text>
</g>

<g>
  <rect x="40" y="274" width="600" height="56" rx="8" fill="#F3EFFF" stroke="#7A5AF8" stroke-width="0.5"/>
  <text x="60" y="294" font-size="13" font-weight="500" fill="#5B3DF5" dominant-baseline="central">上下文层（Context）</text>
  <text x="60" y="314" font-size="12" fill="#7A5AF8" dominant-baseline="central">上下文物化 → ContextPack 组装（筛选/压缩/隔离）· TTL 保留 · 反投毒（重建世界当前状态）</text>
</g>

<g>
  <rect x="40" y="342" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="60" y="362" font-size="13" font-weight="500" fill="#444441" dominant-baseline="central">执行层</text>
  <text x="60" y="382" font-size="12" fill="#5F5E5A" dominant-baseline="central">命中：调用已固化 Workflow ｜ 未命中：六步自主管线（含上下文物化）</text>
</g>

<g>
  <rect x="40" y="410" width="600" height="56" rx="8" fill="#E8EFFA" stroke="#3B5BDB" stroke-width="0.5"/>
  <text x="60" y="430" font-size="13" font-weight="500" fill="#2B4BB0" dominant-baseline="central">Workflow 编排层（LangGraph）</text>
  <text x="60" y="450" font-size="12" fill="#3B5BDB" dominant-baseline="central">固化时按执行轨迹构图 · 加载已固化图执行 · 状态/重试/降级 · 步骤级审计</text>
</g>

<g>
  <rect x="40" y="478" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="60" y="498" font-size="13" font-weight="500" fill="#444441" dominant-baseline="central">接入层</text>
  <text x="60" y="518" font-size="12" fill="#5F5E5A" dominant-baseline="central">MCP · CLI · API · SQL —— 访问真实业务系统（观察世界）</text>
</g>

<g>
  <rect x="40" y="546" width="600" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="60" y="566" font-size="13" font-weight="500" fill="#085041" dominant-baseline="central">治理层（横切）</text>
  <text x="60" y="586" font-size="12" fill="#0F6E56" dominant-baseline="central">分级授权 · 固化人工审批 · Context 审计 · 版本失效 · 四层评估（Outcome/Traj/Golden/回归）· 运行监控</text>
</g>

<text x="40" y="624" font-size="11" fill="#888780" dominant-baseline="central">执行细节（双路径 + LangGraph 编排 + 固化审批 + 认知闭环）见 pipeline.svg</text>
</svg>
